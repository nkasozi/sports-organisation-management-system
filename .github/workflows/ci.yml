name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          # Intentionally no 'cache:' here — caching is managed explicitly below
          # to prevent PR workflows from ever writing to the shared cache.

      # Read-only restore: safe for both PRs and main branch pushes.
      # actions/cache/restore never writes back, preventing cache poisoning
      # from untrusted pull request branches.
      - name: Restore npm cache (read-only)
        id: npm-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.yaml', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # --ignore-scripts blocks postinstall/preinstall lifecycle scripts.
      # A poisoned cache entry cannot execute arbitrary code during restoration.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Cache writes are gated to main-branch pushes only.
      # Pull request workflows can never overwrite the trusted cache.
      - name: Save npm cache (main branch only)
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.npm-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.yaml', 'frontend/package-lock.json') }}

      - name: Security audit
        run: npm audit --audit-level=high

      - run: npm run check

      - run: npm run build

      - run: npm run test
